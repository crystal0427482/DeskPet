name: Build DeskPet APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK (if keystore configured)
        if: false
        run: |
          # 签名步骤需要配置 keystore 密钥
          # 在 GitHub Secrets 中设置:
          #   KEYSTORE_BASE64: keystore 文件的 base64 编码
          #   KEYSTORE_PASSWORD: 密钥库密码
          #   KEY_ALIAS: 密钥别名
          #   KEY_PASSWORD: 密钥密码
          echo "Skipping signing step - configure GitHub Secrets to enable"

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}